name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        run: |
          python3 -c "import ast; ast.parse(open('.claude-plugin/scripts/aichatlog.py').read()); print('aichatlog.py OK')"
          python3 -c "import ast; ast.parse(open('src/aichatlog/core.py').read()); print('core.py OK')"

      - name: Install plugin
        run: pip install -e .

      - name: Run unit tests
        run: python3 tests/test_plugin.py
